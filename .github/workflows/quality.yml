name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository invariants
        run: python scripts/validate-repository.py

      - name: Scan for credentials
        run: python scripts/validate-secrets.py

      - name: Validate source policy
        run: python scripts/validate-source-policy.py

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Check project formatting
        run: scripts/project-check.sh format

      - name: Lint project
        run: scripts/project-check.sh lint

      - name: Type-check project
        run: scripts/project-check.sh typecheck

      - name: Test project
        run: scripts/project-check.sh test

      - name: Build project
        run: scripts/project-check.sh build

  nix:
    name: Nix flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Check flake
        run: nix flake check --no-build
