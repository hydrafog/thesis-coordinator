min_version: 1.7.15

skip_output:
  - meta
  - summary

pre-commit:
  parallel: true
  commands:
    whitespace:
      run: git diff --cached --check
    repository:
      run: python3 scripts/validate-repository.py
    staged-security:
      run: python3 scripts/validate-secrets.py --cached
    source-policy:
      run: python3 scripts/validate-source-policy.py
    formatter:
      glob: "**/*.{js,jsx,ts,tsx,json,css,scss,yml,yaml}"
      run: scripts/project-check.sh format
    lint:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: scripts/project-check.sh lint
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: scripts/project-check.sh typecheck

pre-push:
  parallel: false
  commands:
    repository:
      run: python3 scripts/validate-repository.py
    security:
      run: python3 scripts/validate-secrets.py
    source-policy:
      run: python3 scripts/validate-source-policy.py
    nix:
      run: nix flake check --no-build
    formatter:
      run: scripts/project-check.sh format
    lint:
      run: scripts/project-check.sh lint
    typecheck:
      run: scripts/project-check.sh typecheck
    tests:
      run: scripts/project-check.sh test
    build:
      run: scripts/project-check.sh build

commit-msg:
  commands:
    format:
      run: python3 scripts/validate-commit-message.py {1}
